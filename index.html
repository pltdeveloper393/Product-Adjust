<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#060B16">
  <meta name="description" content="Product ADJust — вход в аккаунт. ИИ-генерация карточек товаров для продавцов Беларуси.">
  <title>Авторизация — Product ADJust</title>

  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/normalize.min.css">
  <link rel="stylesheet" href="css/style.min.css">
</head>
<body>

  <main class="auth">

    <!-- Бренд-панель (только планшет/десктоп) -->
    <aside class="auth__aside">
      <div class="auth__logo">
        <div class="auth__logo-icon">
          <svg viewBox="0 0 160 160" role="img" aria-label="Product ADJust">
            <defs>
              <linearGradient id="ab-bg" x1="0.1" y1="0" x2="0.6" y2="1">
                <stop offset="0%" stop-color="#1E2B45"/><stop offset="100%" stop-color="#0A1220"/>
              </linearGradient>
              <linearGradient id="ab-body" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#E8EDF5"/><stop offset="100%" stop-color="#7C8AA3"/>
              </linearGradient>
              <linearGradient id="ab-stem" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <rect width="160" height="160" rx="32" fill="url(#ab-bg)"/>
            <g transform="translate(30,30)">
              <path d="M18 12 L48 12 C74 12 90 30 90 50 C90 70 74 88 48 88 L18 88 Z M38 30 L48 30 C60 30 70 38 70 50 C70 62 60 70 48 70 L38 70 Z"
                    fill="url(#ab-body)" fill-rule="evenodd"/>
              <rect x="18" y="12" width="20" height="76" fill="url(#ab-stem)"/>
              <circle cx="28" cy="50" r="6" fill="#02040A"/>
              <circle cx="28" cy="50" r="2.5" fill="#A5B4FC"/>
            </g>
          </svg>
        </div>
        <div class="auth__name"><span>Product </span><span class="a">A</span><span class="d">D</span><span>Just</span></div>
        <div class="auth__tagline">AI-powered product cards</div>
      </div>
    </aside>

    <!-- Форма входа -->
    <section class="auth__panel">

      <!-- Логотип для мобильных -->
      <div class="auth__logo">
        <div class="auth__logo-icon">
          <svg viewBox="0 0 160 160" role="img" aria-label="Product ADJust">
            <defs>
              <linearGradient id="am-bg" x1="0.1" y1="0" x2="0.6" y2="1">
                <stop offset="0%" stop-color="#1E2B45"/><stop offset="100%" stop-color="#0A1220"/>
              </linearGradient>
              <linearGradient id="am-body" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#E8EDF5"/><stop offset="100%" stop-color="#7C8AA3"/>
              </linearGradient>
              <linearGradient id="am-stem" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#A5B4FC"/><stop offset="100%" stop-color="#6366F1"/>
              </linearGradient>
            </defs>
            <rect width="160" height="160" rx="32" fill="url(#am-bg)"/>
            <g transform="translate(30,30)">
              <path d="M18 12 L48 12 C74 12 90 30 90 50 C90 70 74 88 48 88 L18 88 Z M38 30 L48 30 C60 30 70 38 70 50 C70 62 60 70 48 70 L38 70 Z"
                    fill="url(#am-body)" fill-rule="evenodd"/>
              <rect x="18" y="12" width="20" height="76" fill="url(#am-stem)"/>
              <circle cx="28" cy="50" r="6" fill="#02040A"/>
              <circle cx="28" cy="50" r="2.5" fill="#A5B4FC"/>
            </g>
          </svg>
        </div>
        <div class="auth__name"><span>Product </span><span class="a">A</span><span class="d">D</span><span>Just</span></div>
        <div class="auth__tagline">AI-powered product cards</div>
      </div>

      <form class="auth__form" action="#" method="post" novalidate>
        <h1 class="hero__title">Вход в аккаунт</h1>

        <div class="field">
          <label class="field__label" for="email">Email</label>
          <input class="input" id="email" name="email" type="email" inputmode="email"
                 autocomplete="email" placeholder="your@email.com" required>
        </div>

        <div class="field">
          <label class="field__label" for="password">Пароль</label>
          <div class="input-wrap">
            <input class="input" id="password" name="password" type="password"
                   autocomplete="current-password" placeholder="Введите пароль" required>
            <button class="input-wrap__btn" type="button" data-toggle-password="password"
                    aria-label="Показать пароль" aria-pressed="false">
              <i class="fa-solid fa-eye" data-eye-on aria-hidden="true"></i>
              <i class="fa-solid fa-eye-slash" data-eye-off hidden aria-hidden="true"></i>
            </button>
          </div>
        </div>

        <a class="auth__forgot" href="#">Забыли пароль?</a>

        <button class="btn btn--primary btn--block" type="submit">Войти</button>

        <div class="auth__divider">или</div>

        <button class="auth__alt" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" style="width:1.125rem;height:1.125rem;">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Войти через Google
        </button>

        <p class="auth__footer">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
      </form>

    </section>

  </main>

  <script src="js/app.min.js" defer></script>
</body>
</html>
